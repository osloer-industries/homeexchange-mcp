name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    uses: osloer-industries/.github/.github/workflows/release-please.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}