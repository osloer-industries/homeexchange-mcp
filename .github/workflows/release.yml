name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    uses: osloer-industries/.github/.github/workflows/release-please.yml@a6ee91211fd9ba096ec141bacdb67985a82b6767 # v0.1.7
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}